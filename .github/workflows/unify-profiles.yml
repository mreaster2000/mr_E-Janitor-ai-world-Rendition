name: Normalize 61 creator profiles (one-time editorial pass)
on:
  push:
    branches: [rendition-overhaul-2026-11-05]
    paths: ['tools/unify_profiles.py', '.github/workflows/unify-profiles.yml']
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unify the 60 remaining profiles
        run: python tools/unify_profiles.py
      - name: Confirm that scripts remain unchanged
        run: |
          if git diff --name-only | grep -E '/SCRIPT[.]js$'; then
            echo 'Character scripts must remain untouched'; exit 1
          fi
      - name: Validate profiles and existing scripts
        run: |
          node tests/test_longform.js
          node tests/test_structure.js
          node tests/test_scripts.js
      - name: Commit only BIO/CARD changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u characters
          if ! git diff --cached --quiet; then
            git commit -m "editorial: normalize 61 long-form character biographies and Card v4 files"
            git push origin HEAD:rendition-overhaul-2026-11-05
          fi
