name: One-time appearance punctuation alignment
on:
  push:
    branches: [rendition-overhaul-2026-11-05]
    paths: ['tools/polish_card_fields.py', '.github/workflows/polish-card-fields.yml']
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Polish Card v4 appearances and match each BIO
        run: python tools/polish_card_fields.py
      - name: Ensure scripts unchanged
        run: |
          if git diff --name-only | grep -E '/SCRIPT[.]js$'; then exit 1; fi
      - name: Validate all 61 character profiles
        run: |
          python tests/test_profile_schema.py
          node tests/test_longform.js
          node tests/test_structure.js
          node tests/test_scripts.js
      - name: Commit card-only cosmetic alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u characters
          if ! git diff --cached --quiet; then
            git commit -m "editorial: reconcile all 61 Card appearance fields to BIO details"
            git push origin HEAD:rendition-overhaul-2026-11-05
          fi
